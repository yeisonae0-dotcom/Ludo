<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ludo Royale</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#8ec5ff;--g2:#0a84ff;--bg:#07070d;--tx:#f5efe0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at top,#241a42,var(--bg) 65%);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden}
#root{height:100%;position:relative;transition:filter .2s}
.gold{font-family:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;background:linear-gradient(90deg,var(--g2),var(--g1),var(--g2));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite;margin:0}
@keyframes sh{to{background-position:200%}}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle,#2a1d52,#05050a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .9s,transform .9s}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
#splash{overflow:hidden}
#splash h1{margin:0;display:flex;font:800 clamp(30px,9vw,52px) ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;letter-spacing:6px;perspective:600px;filter:drop-shadow(0 0 14px #8ec5ff66)}
.lt{display:inline-block;background:linear-gradient(180deg,#fff8d0,#8ec5ff 45%,#5aa9ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:lt 1s cubic-bezier(.2,.9,.3,1) both,lp 2.2s ease-in-out infinite}
@keyframes lt{from{opacity:0;transform:translateY(44px) scale(.5) rotateX(80deg);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes lp{0%,60%,100%{filter:brightness(1)}30%{filter:brightness(1.8)}}
.ln{height:2px;width:0;background:linear-gradient(90deg,transparent,var(--g1),transparent);animation:lw 1.4s 1.8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes lw{to{width:min(70vw,280px)}}
.ld{width:min(60vw,200px);height:3px;border-radius:3px;background:#fff2;overflow:hidden;margin-top:14px;animation:rv 1s 1s both}
.ld b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g1));box-shadow:0 0 10px var(--g1);animation:ldg 3.6s .6s ease-in-out forwards}
@keyframes ldg{to{width:100%}}
.pt{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:var(--g1);box-shadow:0 0 8px var(--g1);opacity:0;animation:up var(--d) linear var(--w) infinite}
@keyframes up{10%{opacity:.9}100%{transform:translate(var(--x),-110vh);opacity:0}}
#splash p{letter-spacing:8px;font-size:11px;color:var(--g1);animation:rv 1.6s 1.2s both;margin:0}
@keyframes rv{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.die{animation:dz 1.4s cubic-bezier(.2,.9,.3,1) both,fl 3s 1.4s ease-in-out infinite;filter:drop-shadow(0 0 22px #8ec5ff99)}
@keyframes dz{from{opacity:0;transform:scale(0) rotate(-540deg)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-8px) rotate(8deg)}}
.ring{position:absolute;width:200px;height:200px;border-radius:50%;border:1px solid #8ec5ff66;animation:rg 3s ease-out infinite;top:calc(50% - 150px)}
.ring.r2{animation-delay:1.5s}
@keyframes rg{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.scr.on{display:flex;animation:in .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(34px) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.card{width:min(92vw,380px);padding:22px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid rgba(142,197,255,.35);backdrop-filter:blur(14px);box-shadow:0 20px 60px #000a,inset 0 0 30px rgba(142,197,255,.05);display:flex;flex-direction:column;gap:12px;text-align:center}
.btn{border:0;border-radius:14px;padding:14px;font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#06182e;background:linear-gradient(135deg,var(--g1),var(--g2));cursor:pointer;box-shadow:0 6px 20px #0a84ff55;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4}
.btn.o{background:transparent;color:var(--g1);border:1px solid var(--g2);box-shadow:none}
.row{display:flex;gap:8px}.sm{flex:1;padding:10px;font-size:13px}
.lb{font-size:12px;letter-spacing:1px;color:var(--g1);opacity:.85;text-transform:uppercase}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid var(--g2);background:#0006;color:var(--tx);font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;text-align:center;outline:0}
input[type=text]:focus{box-shadow:0 0 16px #8ec5ff55}
#jc{font:800 34px ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;letter-spacing:12px;padding-left:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{min-width:54px;padding:10px;border-radius:12px;border:1px solid #fff3;background:#0005;color:var(--tx);font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;cursor:pointer;transition:.25s}
.pill.sel{border-color:var(--g1);color:var(--g1);box-shadow:0 0 14px #8ec5ff66;transform:translateY(-2px)}
.av{border-radius:50%;border:2px solid var(--g2);flex:none;box-sizing:border-box}
.ab{border:0;background:0;padding:0;border-radius:50%;cursor:pointer;transition:.25s;line-height:0}
.ab.sel{box-shadow:0 0 18px var(--g1);transform:scale(1.15)}
#me{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 6px;border-radius:99px;border:1px solid var(--g2);background:#0006;cursor:pointer;font-size:14px}
#code{white-space:nowrap}
.dg{display:inline-grid;place-items:center;width:42px;height:56px;margin:0 3px;border-radius:12px;background:linear-gradient(160deg,#2a2150,#140f2b);border:1px solid var(--g2);font:800 28px ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;color:var(--g1);animation:in .6s both;box-shadow:0 6px 14px #0008}
.slot{width:56px;height:56px;border-radius:50%;border:2px dashed #fff4;display:grid;place-items:center;transition:.4s}
.slot.f{border:0;animation:in .5s both;line-height:0}
.slot:not(.f){border-top-color:var(--g1);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shk{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:75;width:46px;height:46px;border-radius:14px;border:1px solid var(--g2);background:#000b;display:none;cursor:pointer;padding:0}
#hb b{position:absolute;left:12px;width:22px;height:2.5px;border-radius:2px;background:var(--g1);transition:transform .4s cubic-bezier(.2,.9,.3,1),opacity .25s,top .4s}
#hb b:nth-child(1){top:15px}#hb b:nth-child(2){top:22px}#hb b:nth-child(3){top:29px}
#hb.x b:nth-child(1){top:22px;transform:rotate(45deg)}
#hb.x b:nth-child(2){opacity:0;transform:scaleX(0)}
#hb.x b:nth-child(3){top:22px;transform:rotate(-45deg)}
#bk{position:fixed;inset:0;z-index:70;background:#0009;opacity:0;pointer-events:none;transition:opacity .3s}
#bk.on{opacity:1;pointer-events:auto}
#dd{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:12px;width:min(72vw,232px);z-index:72;padding:8px;border-radius:20px;background:linear-gradient(180deg,#1a1236,#0b0816);border:1px solid var(--g2);transform:translateX(125%);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s;display:flex;flex-direction:column;gap:2px;box-shadow:0 20px 50px #000a}
#dd.on{transform:none;opacity:1;pointer-events:auto}
#dd button{background:0;border:0;border-bottom:1px solid #fff1;color:var(--tx);text-align:left;padding:12px;font:600 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;cursor:pointer;opacity:0;transform:translateX(24px);transition:.4s}
#dd.on button{opacity:1;transform:none}
#dd.on button:nth-child(2){transition-delay:.05s}#dd.on button:nth-child(3){transition-delay:.1s}#dd.on button:nth-child(4){transition-delay:.15s}#dd.on button:nth-child(5){transition-delay:.2s}#dd.on button:nth-child(6){transition-delay:.25s}
#dd button:active{background:#8ec5ff22}
.modal{position:fixed;inset:0;z-index:90;background:#000b;display:none;align-items:center;justify-content:center}
.modal.on{display:flex;animation:in .4s both}
.modal .card{max-height:86vh;overflow:auto}
.modal input[type=range]{width:100%;accent-color:var(--g1)}
.lg{display:block;width:100%;margin-bottom:6px;padding:12px;border-radius:12px;border:1px solid #fff2;background:#0004;color:var(--tx);font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;cursor:pointer}
.lg.sel{border-color:var(--g1);color:var(--g1)}
#s-game{justify-content:flex-start;padding-top:62px;gap:12px}
#ft{width:min(94vw,calc(100vh - 320px));width:min(94vw,calc(100dvh - 320px));display:flex;align-items:center;gap:12px;min-height:66px}
#st{font-size:12px;color:var(--g1);line-height:1.3;flex:1}
#wt2{display:none;align-items:center;gap:10px;padding:11px 18px;border-radius:99px;background:#0009;border:1px solid var(--g2);font-size:13px;color:var(--g1);animation:in .5s both}
.dts u{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--g1);animation:dt 1s infinite}
.dts u:nth-child(2){animation-delay:.15s}.dts u:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
#pl{display:flex;flex-direction:column;gap:3px;padding:6px;min-width:200px;max-width:92vw;border-radius:20px;background:linear-gradient(160deg,#1c1438f2,#0b0816f2);border:1px solid var(--g2);box-shadow:0 8px 24px #000a,inset 0 0 20px #8ec5ff0f}
.pr{position:relative;display:flex;align-items:center;gap:9px;padding:3px 12px 3px 3px;border-radius:99px;background:#ffffff08;border:1px solid #fff1;font-size:13px;font-weight:600;opacity:.5;transition:.4s}
.pr .av{border-color:var(--c)}
.pr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.pr em{font-style:normal;min-width:22px;height:22px;border-radius:7px;background:var(--g1);color:#06182e;display:none;place-items:center;font-size:13px;font-weight:800}
.pr em:not(:empty){display:grid;animation:in .3s both}
.pr.act{opacity:1;border-color:var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent);transform:scale(1.04);animation:glw 1.1s ease-in-out infinite alternate}
.pr.act span{color:#fff;text-shadow:0 0 8px var(--c),0 0 16px var(--g1)}
@keyframes glw{from{box-shadow:0 0 6px var(--c)}to{box-shadow:0 0 20px var(--c),inset 0 0 8px #fff4}}
#dice{width:62px;height:62px;border-radius:16px;border:2px solid var(--g2);background:linear-gradient(145deg,#fffdf4,#d9cfb0);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;gap:3px;cursor:pointer;box-shadow:0 6px 14px #000a,inset 0 -4px 8px #0003}
#dice i{border-radius:50%;background:radial-gradient(circle at 35% 35%,#555,#111);transform:scale(0);transition:transform .15s}
#dice i.on{transform:scale(1)}
#dice.rdy{animation:gl .8s infinite alternate}
@keyframes gl{to{box-shadow:0 0 24px var(--g1),0 6px 14px #000a;transform:scale(1.1)}}
#dice.roll{animation:tum .64s ease-in-out}
@keyframes tum{0%{transform:none}30%{transform:translateY(-26px) rotate(200deg) scale(1.2)}60%{transform:translateY(0) rotate(420deg) scale(.9)}80%{transform:translateY(-8px) rotate(560deg) scale(1.08)}100%{transform:rotate(720deg)}}
#bd{direction:ltr;position:relative;width:min(94vw,calc(100vh - 320px));width:min(94vw,calc(100dvh - 320px));aspect-ratio:1;border-radius:16px;border:3px solid var(--g2);box-shadow:0 0 0 3px #000a,0 0 50px #0a84ff44,0 20px 40px #000a;background:#0d0a18}
#gr{display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr);gap:1px;padding:1px;background:#2b2146;width:100%;height:100%;border-radius:12px;overflow:hidden}
.c{border-radius:3px;box-shadow:inset 0 -2px 2px #0002,inset 0 1px 1px #fff7;display:grid;place-items:center;font-size:min(3.4vw,2.1vh);color:#9a7b05}
.qd{position:absolute;width:40%;height:40%;border-radius:12px;box-shadow:inset 0 0 22px #0006;z-index:1}
.qd .pl{position:absolute;inset:16.667%;border-radius:14%;background:radial-gradient(circle,#1d1733,#0c0916);box-shadow:inset 0 0 14px #000}
.qd i{position:absolute;width:25%;height:25%;border-radius:50%;border:2px dashed}
#ct{position:absolute;left:40%;top:40%;width:20%;height:20%;z-index:2;background:conic-gradient(from -45deg,#2dc653 0 25%,#f4c430 0 50%,#3a86ff 0 75%,#e63946 0 100%);box-shadow:inset 0 0 14px #0009}
#ct::after{content:'';position:absolute;inset:34%;border-radius:50%;background:radial-gradient(#fff,var(--g1));box-shadow:0 0 12px var(--g1)}
#tks{position:absolute;inset:0;pointer-events:none;z-index:3}
.tk{position:absolute;width:6.667%;height:6.667%;transition:left .34s ease-in-out,top .34s ease-in-out;will-change:left,top;pointer-events:auto;animation:sp .5s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes sp{from{transform:scale(0)}to{transform:none}}
.tk svg{position:absolute;left:5%;bottom:8%;width:90%;height:auto;overflow:visible;filter:drop-shadow(0 3px 2px #0009);transform-origin:50% 90%}
.tk.mv svg{animation:bob .45s ease-in-out infinite alternate;cursor:pointer}
@keyframes bob{to{transform:translateY(-22%) scale(1.12);filter:drop-shadow(0 0 7px #fff)}}
#rb{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;width:58px;height:58px;border-radius:50%;border:2px solid var(--g1);background:#0b0816;display:none;place-items:center;cursor:pointer;padding:0}
#rb::before{content:'';position:absolute;inset:3px;border-radius:50%;background:#0b0816}
#rb svg{position:relative;width:28px;height:28px;fill:none;stroke:var(--g1);stroke-width:2;stroke-linejoin:round}
#rb span{position:absolute;font:800 22px ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;color:var(--g1);display:none}
#rb.cd{background:conic-gradient(var(--g1) var(--p,0%),#2a2140 0);pointer-events:none}
#rb.cd svg{opacity:.15}#rb.cd span{display:block}
#tray{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;display:none;flex-direction:column;gap:4px;padding:8px;border-radius:22px;background:#120d24f2;border:1px solid var(--g2)}
#tray.on{display:flex;animation:in .3s both}
#tray button{background:0;border:0;font-size:28px;cursor:pointer;padding:3px 6px;transition:transform .15s}
#tray button:active{transform:scale(1.4)}
.rx{position:fixed;bottom:30%;z-index:95;font-size:64px;text-align:center;pointer-events:none;animation:rx 2s ease-out both;line-height:1.1}
.rx .av{display:block;margin:0 auto 4px}
@keyframes rx{0%{transform:scale(0);opacity:0}15%{transform:scale(1.3);opacity:1}80%{opacity:1}100%{transform:translateY(-80px);opacity:0}}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;padding:10px 18px;border-radius:99px;background:#000d;border:1px solid var(--g2);font-size:13px;display:none}
:root{--tx:#f4f6fc;--sub:rgba(232,238,255,.62);--gb:rgba(255,255,255,.28);--bg:#0b0d1a;--sf:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
html,body{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--sf);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
#root{background:radial-gradient(60% 45% at 18% 8%,#4b3fd066,transparent 70%),radial-gradient(55% 40% at 88% 22%,#0a84ff55,transparent 70%),radial-gradient(60% 50% at 50% 105%,#d6338a55,transparent 70%),var(--bg)}
button,#dice,.tk{touch-action:manipulation;font-family:var(--sf)}
.card,#pl,#dd,#tray,#wt2,#toast,#me,#hb{background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.07) 46%,rgba(255,255,255,.13));border:1px solid var(--gb);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 12px 32px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08)}
.card{border-radius:28px;padding:24px;gap:14px}
.modal{background:rgba(8,10,22,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#bk{background:rgba(8,10,22,.35)}
.gold,#wk{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--tx);animation:none;font-family:var(--sf);font-weight:700;letter-spacing:-.02em}
h2.gold{font-size:28px}h3.gold{font-size:20px}
.btn{min-height:50px;border-radius:16px;color:#fff;font-weight:600;letter-spacing:-.01em;background:linear-gradient(180deg,#63b3ff,#0a84ff 55%,#0670e0);box-shadow:0 8px 22px rgba(10,132,255,.40),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.18);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.btn.o{color:var(--tx);text-shadow:none;background:linear-gradient(140deg,rgba(255,255,255,.20),rgba(255,255,255,.07));border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
input[type=text]{border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.10);color:var(--tx);font-family:var(--sf);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
input[type=text]:focus{border-color:var(--g1);box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 0 0 4px rgba(10,132,255,.30)}
.pill,.lg{min-height:46px;background:rgba(255,255,255,.10);border:1px solid var(--gb);color:var(--tx);font-family:var(--sf);border-radius:14px}
.pill.sel,.lg.sel{background:rgba(10,132,255,.35);border-color:var(--g1);color:#fff;box-shadow:0 0 0 1px var(--g1),0 6px 16px rgba(10,132,255,.35)}
.lb{color:var(--sub);font-weight:600;letter-spacing:.08em}
.dg,#jc,#rb span{font-family:ui-rounded,"SF Pro Rounded",var(--sf);font-variant-numeric:tabular-nums}
.dg{background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.07));border:1px solid var(--gb);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.3)}
.av{border:2px solid rgba(255,255,255,.75)}
.ab.sel{box-shadow:0 0 0 3px var(--g1),0 8px 18px rgba(10,132,255,.4)}
#me{color:var(--tx)}
#hb{border-radius:16px}#hb b{background:var(--tx)}
#dd{border-radius:24px;padding:8px}
#dd button{color:var(--tx);font-family:var(--sf);min-height:48px;border-bottom:1px solid rgba(255,255,255,.12)}
#dd button:last-child{border-bottom:0}
#dd button:active{background:rgba(255,255,255,.12)}
#splash{background:radial-gradient(60% 45% at 20% 12%,#5a4fd088,transparent 70%),radial-gradient(55% 40% at 85% 30%,#0a84ff66,transparent 70%),radial-gradient(60% 50% at 50% 100%,#d6338a55,transparent 70%),#080a16}
#splash h1{font-family:var(--sf);font-weight:700;letter-spacing:.16em}
.lt{background:linear-gradient(180deg,#fff,#d6e9ff 60%,#8ec5ff);-webkit-background-clip:text;background-clip:text}
.ring{border-color:rgba(255,255,255,.3)}
.die{filter:drop-shadow(0 0 22px rgba(10,132,255,.6))}
.ld{background:rgba(255,255,255,.18)}.ld b{background:linear-gradient(90deg,#63b3ff,#fff)}
#pl{border-radius:24px;padding:7px}
.pr{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:var(--tx);font-family:var(--sf)}
.pr.act{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,transparent),rgba(255,255,255,.08))}
.pr.act span{color:var(--tx)}
.pr em{color:#06182e;background:#fff}

const fs = require('fs');
const express = require('express');
const app = express();
const http = require('http').createServer(app);
const io = require('socket.io')(http);

app.get('/estado', (req, res) => res.json({ salas: Object.keys(salas).length, capacidad: MAX_SALAS }));
const HTML = fs.readFileSync(__filename, 'utf8'); // este mismo archivo es el juego
app.get('/', (req, res) => res.type('html').send(HTML));

// codigo -> { codigo, n, publica, host, jugadores, asientos, turnoActual, fase, enCurso, timer }
const MAX_SALAS = 1000; // capacidad: hasta 1000 salas simultáneas (cada una de 2 a 4 jugadores)
const salas = {};
const ASIENTOS = { 2: [0, 2], 3: [0, 1, 2], 4: [0, 1, 2, 3] }; // colores usados según nº de jugadores
const BOTS = [{ name: 'Aria', av: 3 }, { name: 'Zeus', av: 2 }, { name: 'Luna', av: 5 }];

const limpio = p => ({
    name: String((p && p.name) || 'Jugador').replace(/[<>&"]/g, '').slice(0, 12) || 'Jugador',
    av: Number.isInteger(p && p.av) && p.av >= 0 && p.av < 8 ? p.av : 0
});
// Código numérico de `len` dígitos; si esa longitud se llena, usa una más larga (hasta 6)
const nuevoCodigo = len => {
    for (let l = len; l <= 6; l++) {
        for (let i = 0; i < 60; i++) {
            const c = Array.from({ length: l }, () => Math.floor(Math.random() * 10)).join('');
            if (!salas[c]) return c;
        }
    }
    return null;
};
const datosLobby = s => ({ codigo: s.codigo, n: s.n, host: s.host, jugadores: s.jugadores.map(j => j.perfil) });
// Controla el asiento su dueño humano, o el anfitrión si el asiento lo juega la IA
const controla = (s, id, asiento) => {
    const a = s.asientos[asiento];
    return !!a && (a.owner === id || (a.bot && s.host === id));
};

function unir(socket, s, perfil) {
    s.jugadores.push({ id: socket.id, perfil: limpio(perfil) });
    socket.join(s.codigo);
    socket.salaId = s.codigo;
}

function crearSala(socket, n, publica, len, perfil) {
    salir(socket);
    if (Object.keys(salas).length >= MAX_SALAS) return null;
    const codigo = nuevoCodigo(len);
    if (!codigo) return null;
    const s = { codigo, n, publica, host: socket.id, jugadores: [], asientos: [], turnoActual: 0, fase: 'tirar', enCurso: false, timer: null };
    salas[s.codigo] = s;
    unir(socket, s, perfil);
    return s;
}

function empezar(s) {
    if (s.enCurso) return;
    clearTimeout(s.timer);
    s.enCurso = true;
    s.turnoActual = 0;
    s.fase = 'tirar';
    let b = 0;
    // Los asientos sin humano los juega la IA (controlada por el anfitrión)
    s.asientos = ASIENTOS[s.n].map((c, i) => {
        const j = s.jugadores[i];
        return j
            ? { c, name: j.perfil.name, av: j.perfil.av, owner: j.id, bot: false }
            : { c, name: BOTS[b].name, av: BOTS[b++].av, owner: null, bot: true };
    });
    s.jugadores.forEach((j, i) =>
        io.to(j.id).emit('inicio', { salaId: s.codigo, miNumeroJugador: i, asientos: s.asientos, host: s.host })
    );
}

// Quita al jugador; si la partida ya empezó, su asiento pasa a la IA
function salir(socket) {
    const s = salas[socket.salaId];
    if (!s) return;
    socket.leave(s.codigo);
    socket.salaId = null;
    const k = s.jugadores.findIndex(j => j.id === socket.id);
    if (k < 0) return;
    s.jugadores.splice(k, 1);
    if (!s.jugadores.length) { clearTimeout(s.timer); delete salas[s.codigo]; return; }
    if (s.host === socket.id) s.host = s.jugadores[0].id;
    if (s.enCurso) {
        const i = s.asientos.findIndex(a => a.owner === socket.id);
        if (i >= 0) { s.asientos[i].owner = null; s.asientos[i].bot = true; }
        io.to(s.codigo).emit('jugador_salio', { asiento: i, host: s.host });
    } else {
        io.to(s.codigo).emit('lobby', datosLobby(s));
    }
}

io.on('connection', (socket) => {
    console.log(`Jugador conectado: ${socket.id}`);

    // Partida rápida (1 vs 3, 1 vs 2, 1 vs 1): busca sala pública con espacio o crea una.
    // Si en 10 s no se llena, los asientos libres los ocupa la IA.
    socket.on('buscar', ({ n, perfil }) => {
        n = [2, 3, 4].includes(n) ? n : 4;
        salir(socket);
        let s = Object.values(salas).find(x => x.publica && !x.enCurso && x.n === n && x.jugadores.length < n);
        if (s) unir(socket, s, perfil);
        else {
            s = crearSala(socket, n, true, 4, perfil);
            if (!s) return socket.emit('error_sala', 'servidor_lleno');
            const sala = s;
            s.timer = setTimeout(() => empezar(sala), 10000);
        }
        io.to(s.codigo).emit('lobby', datosLobby(s));
        if (s.jugadores.length === n) empezar(s);
    });

    // Crear sala privada con código numérico de 3 a 6 dígitos (o cambiar sus opciones)
    socket.on('crear', ({ n, len, perfil }) => {
        n = Math.min(4, Math.max(2, n | 0));
        len = Math.min(6, Math.max(3, len | 0));
        let s = salas[socket.salaId];
        if (s && !s.enCurso && !s.publica && s.host === socket.id) {
            s.n = Math.max(n, s.jugadores.length);
            const viejo = s.codigo;
            delete salas[viejo];
            s.codigo = nuevoCodigo(len) || viejo;
            salas[s.codigo] = s;
            s.jugadores.forEach(j => {
                const so = io.sockets.sockets.get(j.id);
                if (so) { so.leave(viejo); so.join(s.codigo); so.salaId = s.codigo; }
            });
        } else {
            s = crearSala(socket, n, false, len, perfil);
            if (!s) return socket.emit('error_sala', 'servidor_lleno');
        }
        socket.emit('sala_creada', datosLobby(s));
        io.to(s.codigo).emit('lobby', datosLobby(s));
    });

    // Unirse con código
    socket.on('unirse', ({ codigo, perfil }) => {
        const s = salas[String(codigo)];
        if (!s || s.enCurso || s.jugadores.length >= s.n) return socket.emit('error_sala', s ? 'llena' : 'no_existe');
        salir(socket);
        unir(socket, s, perfil);
        socket.emit('unido', datosLobby(s));
        io.to(s.codigo).emit('lobby', datosLobby(s));
        if (s.publica && s.jugadores.length === s.n) empezar(s);
    });

    // El anfitrión inicia la partida
    socket.on('empezar', ({ codigo }) => {
        const s = salas[codigo];
        if (s && s.host === socket.id && socket.salaId === s.codigo) empezar(s);
    });

    socket.on('salir', () => salir(socket));

    // Escucha las jugadas (dado / ficha / pasar turno) de cada jugador
    socket.on('accion_juego', (datos) => {
        const s = salas[datos.salaId];

        // Valida que quien envía la acción realmente controle el turno actual
        if (!s || !s.enCurso || socket.salaId !== s.codigo || !controla(s, socket.id, s.turnoActual)) return;

        if (datos.tipo === 'tirar' && s.fase === 'tirar') {
            s.fase = 'mover';
            // El dado lo tira el servidor para que nadie pueda hacer trampa
            io.to(s.codigo).emit('actualizar_juego', { tipo: 'tirar', dado: 1 + Math.floor(Math.random() * 6), turno: s.turnoActual });
        } else if (datos.tipo === 'mover' && s.fase === 'mover' && [0, 1, 2, 3].includes(datos.i)) {
            s.fase = 'tirar';
            io.to(s.codigo).emit('actualizar_juego', { tipo: 'mover', ficha: datos.i, turno: s.turnoActual });
        } else if (datos.tipo === 'turno') {
            // Pasa el turno al siguiente jugador de forma cíclica
            s.turnoActual = (s.turnoActual + 1) % s.asientos.length;
            s.fase = 'tirar';

        }
    });

    socket.on('disconnect', () => {
